<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#0f1117" />
  <rect x="2" y="2" width="96" height="96" rx="26" stroke="url(#sk-grad)" stroke-width="2" stroke-opacity="0.6" />
  <!-- Monogram S K -->
  <text x="50" y="63" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="44" fill="url(#sk-grad)" text-anchor="middle" filter="url(#glow)">SK</text>
  <circle cx="80" cy="24" r="4" fill="#06b6d4" />
</svg>
