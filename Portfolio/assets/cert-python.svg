  <rect x="180" y="270" width="240" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="300" y="293" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Recipient: Sanjana K.</text>

  <!-- Verified Badge -->
  <g transform="translate(80, 310)">
    <circle cx="20" cy="20" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M14 20 L18 24 L26 16" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Verified Certification</text>
  </g>
  <text x="520" y="334" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" text-anchor="end">ID: PY-AIML-2024</text>
