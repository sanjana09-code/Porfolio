    <circle cx="2" cy="-12" r="2" fill="#fbbf24" />
    <!-- Blue Snake -->
    <path d="M8 18 C18 18 18 6 8 6 L-6 6 C-14 6 -14 -6 -6 -6 L10 -6" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="-2" cy="12" r="2" fill="#38bdf8" />
  </g>

  <text x="300" y="175" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">VERIFIED CREDENTIAL</text>
  <text x="300" y="210" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Python Programming Specialization</text>
  <text x="300" y="240" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Foundational Knowledge, OOP, Data Structures &amp; AI Scripting</text>

