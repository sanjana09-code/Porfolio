<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="cert-py-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="py-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#cert-py-bg)" />
  <rect x="15" y="15" width="570" height="350" rx="12" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 4" />
  <rect x="25" y="25" width="550" height="330" rx="8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Python Dual Snake Icon Mockup -->
  <g transform="translate(300, 95)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
