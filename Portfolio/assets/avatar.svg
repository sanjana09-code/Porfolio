<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="av-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="av-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="av-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Aura Ring -->
  <circle cx="200" cy="200" r="180" fill="url(#av-bg)" stroke="url(#av-glow)" stroke-width="3" filter="url(#av-shadow)" />
  <circle cx="200" cy="200" r="165" fill="#0b0f19" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Abstract Developer Avatar / Neural Network Nodes -->
  <!-- Shoulders / Silhouette -->
  <path d="M100 340 C100 270 140 250 200 250 C260 250 300 270 300 340 Z" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  
  <!-- Head Silhouette -->
  <circle cx="200" cy="180" r="55" fill="#334155" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Sleek Tech Glasses / Visor -->
  <rect x="160" y="165" width="80" height="20" rx="8" fill="#06b6d4" fill-opacity="0.85" filter="url(#av-shadow)" />
  <line x1="165" y1="175" x2="235" y2="175" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Floating Code & Neural Accents -->
  <g transform="translate(60, 90)">
    <rect width="60" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">&lt;AI/&gt;</text>
  </g>

  <g transform="translate(280, 80)">
    <rect width="65" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="32" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">ML • Py</text>
  </g>

  <g transform="translate(285, 270)">
    <rect width="60" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">{ C++ }</text>
  </g>

  <g transform="translate(55, 260)">
    <rect width="65" height="28" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="32" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">⚡ LPU</text>
  </g>

  <!-- Glowing Neural Constellation Nodes -->
  <circle cx="140" cy="120" r="4" fill="#818cf8" />
  <circle cx="260" cy="120" r="4" fill="#38bdf8" />
  <line x1="140" y1="120" x2="200" y2="135" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
  <line x1="260" y1="120" x2="200" y2="135" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
</svg>
