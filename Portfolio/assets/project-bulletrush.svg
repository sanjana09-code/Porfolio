<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="br-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180728" />
      <stop offset="50%" stop-color="#0f0728" />
      <stop offset="100%" stop-color="#0b112c" />
    </linearGradient>
    <linearGradient id="laser-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="br-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arcade Screen Frame -->
  <rect width="800" height="500" rx="16" fill="url(#br-bg)" />
  
  <!-- Perspective Grid lines -->
  <g stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="400" y1="200" x2="0" y2="500" />
    <line x1="400" y1="200" x2="160" y2="500" />
    <line x1="400" y1="200" x2="320" y2="500" />
    <line x1="400" y1="200" x2="480" y2="500" />
    <line x1="400" y1="200" x2="640" y2="500" />
    <line x1="400" y1="200" x2="800" y2="500" />
    
    <ellipse cx="400" cy="500" rx="400" ry="100" fill="none" />
    <ellipse cx="400" cy="450" rx="300" ry="70" fill="none" />
    <ellipse cx="400" cy="400" rx="200" ry="45" fill="none" />
    <ellipse cx="400" cy="350" rx="120" ry="25" fill="none" />
  </g>

  <!-- HUD Top Bar -->
  <rect x="40" y="30" width="720" height="60" rx="12" fill="#0b0f19" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" />
  
  <text x="70" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8">BULLET RUSH // V1.0</text>
  <text x="320" y="66" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#f43f5e" letter-spacing="2">SCORE: <tspan fill="#ffffff">18,450</tspan></text>
  
  <rect x="580" y="47" width="150" height="26" rx="13" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" />
  <text x="655" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">COMBO x8 🔥</text>

  <!-- Targets in 3D Space -->
  <!-- Target 1 (Hit burst) -->
  <g transform="translate(240, 210)">
    <circle cx="0" cy="0" r="28" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#f43f5e" fill-opacity="0.6" />
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#f43f5e" stroke-width="2" />
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#f43f5e" stroke-width="2" />
    <!-- Score Popup -->
    <text x="25" y="-20" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#fbbf24" filter="url(#br-glow)">+500</text>
  </g>

  <!-- Target 2 (Active Reticle Target) -->
  <g transform="translate(560, 180)">
    <circle cx="0" cy="0" r="36" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="18" fill="#06b6d4" fill-opacity="0.5" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#06b6d4" stroke-width="1.5" />
    <!-- Lock-on Marker -->
    <rect x="-42" y="-42" width="84" height="84" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="14 28" />
  </g>

  <!-- Target 3 (Distance bonus) -->
  <g transform="translate(380, 140)">
    <circle cx="0" cy="0" r="18" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="2" />
    <circle cx="0" cy="0" r="7" fill="#e879f9" />
  </g>

  <!-- Player Weapon / Reticle System at bottom center -->
  <g transform="translate(400, 430)">
    <!-- Laser Beam Streams firing upward -->
    <path d="M-15 -30 L-140 -200" stroke="url(#laser-grad)" stroke-width="4" stroke-linecap="round" filter="url(#br-glow)" />
    <path d="M15 -30 L160 -240" stroke="url(#laser-grad)" stroke-width="4" stroke-linecap="round" filter="url(#br-glow)" />
    
    <!-- Player Cannon / Ship -->
    <polygon points="0,-40 -35,30 35,30" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <polygon points="0,-30 -20,20 20,20" fill="#4338ca" />
    <circle cx="0" cy="-5" r="8" fill="#38bdf8" filter="url(#br-glow)" />

    <!-- Weapon Flash -->
    <circle cx="0" cy="-45" r="14" fill="#ffffff" opacity="0.9" filter="url(#br-glow)" />
  </g>

  <!-- Modern Game Feature Badges -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="90" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">HTML5 Canvas Engine</text>
    
    <rect x="195" y="0" width="190" height="30" rx="15" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
    <text x="290" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">Dynamic Particle Physics</text>

    <rect x="400" y="0" width="180" height="30" rx="15" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
    <text x="490" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#67e8f9" text-anchor="middle">Score & Combo Multiplier</text>
  </g>
</svg>
