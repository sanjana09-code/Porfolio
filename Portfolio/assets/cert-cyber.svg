<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="cert-cy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09181d" />
      <stop offset="50%" stop-color="#112d38" />
      <stop offset="100%" stop-color="#09181d" />
    </linearGradient>
    <linearGradient id="cy-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#cert-cy-bg)" />
  <rect x="15" y="15" width="570" height="350" rx="12" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 4" />
  <rect x="25" y="25" width="550" height="330" rx="8" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" />

  <!-- Shield Lock Icon -->
  <g transform="translate(300, 95)">
    <circle cx="0" cy="0" r="38" fill="#0b1e28" stroke="#06b6d4" stroke-width="2" />
    <!-- Shield -->
    <path d="M0 -18 L18 -10 L18 8 C18 18 0 24 0 24 C0 24 -18 18 -18 8 L-18 -10 Z" fill="#0e3a47" stroke="#22d3ee" stroke-width="2" />
    <!-- Keyhole -->
    <circle cx="0" cy="2" r="3" fill="#ffffff" />
    <path d="M-2 2 L2 2 L3 9 L-3 9 Z" fill="#ffffff" />
  </g>

  <text x="300" y="175" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle" letter-spacing="2">SECURITY CREDENTIAL</text>
  <text x="300" y="210" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Cybersecurity Fundamentals</text>
  <text x="300" y="240" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Network Defense, Cryptography Concepts &amp; Threat Analysis</text>

  <!-- Issued To -->
  <rect x="180" y="270" width="240" height="36" rx="18" fill="#0f2936" stroke="#155e75" stroke-width="1" />
  <text x="300" y="293" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">Recipient: Sanjana K.</text>

  <!-- Verified Badge -->
  <g transform="translate(80, 310)">
    <circle cx="20" cy="20" r="14" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
    <path d="M14 20 L18 24 L26 16" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Verified Certification</text>
  </g>
  <text x="520" y="334" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" text-anchor="end">ID: CYBER-SEC-2024</text>
</svg>
